name: gate
on: [push, workflow_dispatch]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: proof-of-play — the org law
        run: node --test company.test.mjs

      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tests
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate company.mjs \
            --timeout 60000 \
            --test node --test company.test.mjs

      - name: the shipped page still matches the law
        run: |
          cp index.html /tmp/shipped.html
          node scripts/build-company.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from company-data.json — run scripts/build-company.mjs and commit."
            exit 1
          }
